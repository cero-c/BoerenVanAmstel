<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boerderij Polderzicht</title>
    <link rel="stylesheet" href="style-yunus.css">
</head>

<body>
    <img src="images/kaartGruttoPers.png" class="map-bg" alt="Kaart">


    <nav class="side-navbar">
        <div class="nav-top"><img src="images/hamburgermenu.png" class="menu-icon"></div>
        <div class="nav-bottom">
            <img src="images/boerPersOptie.svg" class="nav-btn">
            <img src="images/settings.png" class="nav-btn">
            <img src="images/info.png" class="nav-btn">
        </div>
    </nav>

    <div class="doneer-flap">Doneer</div>
    <img src="images/wolkAchterLogo.png" class="wolkAchterLogo">
    <img src="images/bva-logo-blauw.png" class="logoKaart">

    <section class="content-overlay">
        <div class="dome-container">
            <img src="images/groteWolkTextbox.png" class="dome-bg">
            <img src="images/sluitButton.png" class="close-png" onclick="window.history.back()">

            <div class="title-wrapper">
                <h2 class="title-blue">Boerderij Polderzicht</h2>
            </div>

            <div class="info-layout">
                <p class="intro-center">Boerderij Polderzicht is meer dan een boerderij. Geniet van een cappuccino, een
                    lekkere lunch of een tosti in het Polderhuis en ontdek ondertussen het boerenleven. Op het erf kun
                    je dieren bekijken, spelen en ervaren waar Boeren van Amstel melk vandaan komt.</p>

                <div class="split-content">
                    <div class="col-left">
                        <img src="images/kaaswielPolderzicht.svg" class="fit-img" alt="Infographic">
                    </div>
                    <div class="col-divider"></div>
                    <div class="col-right">
                        <img src="images/koeienPolderzicht.png" class="rounded-img" alt="Koeien">
                    </div>
                </div>
            </div>

            <div class="route-wrapper">
                            <div class="map-popup" style="display: none;">
                                <span class="close-popup" onclick="closeMapPopup(this)">&times;</span>
                                <button class="btn-action" id="ahMap">Open Google Maps</button>
                                <button class="btn-action" id="ahAppleMaps">Open Apple Maps</button>
                            </div>

                            <button class="btn-action" onclick="openMapPopup(this)">Ontdek route</button>

                        </div>
            <img src="images/boerderijSolo.svg" class="bottom-avatar" alt="Huis">
        </div>
    </section>
</body>
 <script>
        function openMapPopup(btn) {
           
            const wrapper = btn.parentElement;
            const popup = wrapper.querySelector('.map-popup');
            popup.style.display = 'flex';
        }

        function closeMapPopup(closeBtn) {
         
            const popup = closeBtn.parentElement;
            popup.style.display = 'none';
        }

        document.getElementById("ahMap").addEventListener("click", () => {
            window.open(
                "https://www.https://www.google.com/maps?rlz=1C5CHFA_enNL1106NL1107&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIRCAEQLhgNGBMYrwEYxwEYgAQyCwgCEAAYDRgTGIAEMgsIAxAAGA0YExiABDILCAQQABgNGBMYgAQyCggFEAAYDRgTGB4yCggGEAAYDRgTGB4yCggHEAAYgAQYogQyBwgIEAAY7wXSAQg5NTkzajBqNKgCALACAQ&um=1&ie=UTF-8&fb=1&gl=nl&sa=X&geocode=KQWKJLnkCsZHMeQgtYIXp9y4&daddr=Polderweg+23,+1191+JR+Ouderkerk+aan+de+Amstel",
                "_blank"
            );
        });

        document.getElementById("ahAppleMaps").addEventListener("click", () => {
            window.open(
                "https://maps.apple.com/directions?destination=Boerderij+Polderzicht%2C+Polderweg+23%2C+1191+JR+Ouderkerk+aan+de+Amstel%2C+Netherlands&destination-place-id=I1DA079CAD758118D&mode=driving","_blank"
            );
        });


    </script>
</html>
