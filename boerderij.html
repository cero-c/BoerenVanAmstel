<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boerderij Polderzicht</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <img src="images/kaartGruttoPers.png" class="map-bg" alt="Kaart">

    
    <nav class="side-navbar">
        <div class="nav-top"><img src="images/hamburgermenu.png" class="menu-icon"></div>
        <div class="nav-bottom">
            <img src="images/boerPersOptie.svg" class="nav-btn">
            <img src="images/settings.png" class="nav-btn">
            <img src="images/info.png" class="nav-btn">
        </div>
    </nav>

    <div class="doneer-flap">Doneer</div>
    <img src="images/wolkAchterLogo.png" class="wolkAchterLogo">
    <img src="images/bva-logo-blauw.png" class="logoKaart">

    <section class="content-overlay">
        <div class="dome-container">
            <img src="images/groteWolkTextbox.png" class="dome-bg">
            <img src="images/sluitButton.png" class="close-png" onclick="window.history.back()">

            <div class="title-wrapper">
                <h2 class="title-blue">Boerderij Polderzicht</h2>
            </div>

            <div class="info-layout">
                <p class="intro-center">Boerderij Polderzicht is meer dan een boerderij. Geniet van een cappuccino, een lekkere lunch of een tosti in het Polderhuis en ontdek ondertussen het boerenleven. Op het erf kun je dieren bekijken, spelen en ervaren waar Boeren van Amstel melk vandaan komt.</p>
                
                <div class="split-content">
                    <div class="col-left">
                        <img src="images/kaaswielPolderzicht.svg" class="fit-img" alt="Infographic">
                    </div>
                    <div class="col-divider"></div> <div class="col-right">
                        <img src="images/koeienPolderzicht.png" class="rounded-img" alt="Koeien">
                    </div>
                </div>
            </div>

            <img src="images/boerderijSolo.svg" class="bottom-avatar" alt="Huis">
        </div>
    </section>
</body>
</html>
