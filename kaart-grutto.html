<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BvA-Kaart van Amsterdam en Amstelland</title>
    <link rel="stylesheet" href="style-kaart.css">
</head>

<body>
    <header>
        <img src="images/wolkAchterLogo.png" class="wolkAchterLogo">
        <img src="images/Boeren van Amstel_Logo.svg" class="logoKaart">
    </header>
    <main>
        <nav class="side-navbar">
            <div class="nav-top">
                <img src="images/hamburgermenu.png" class="menu-icon" alt="Menu">
            </div>
            <div class="nav-bottom">
                <img src="images/gruttoPersOptie.png" class="nav-btn" alt="Bird">
                <img src="images/settings.png" class="nav-btn" alt="Settings">
                <img src="images/info.png" class="nav-btn" alt="Info">
            </div>
        </nav>
        <canvas id="mapCanvas"></canvas>
    </main>
    <footer>
        <button class="donate-button">Doneer</button>
    </footer>
    <script src="kaart.js"></script>
</body>

</html>
