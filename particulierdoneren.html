<!DOCTYPE html>
<html lang="nl">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Doneer als Particulier - Boeren van Amstel</title>
   <link rel="stylesheet" href="style.css">
</head>
<body class="wave-bg-donation">

<header class="main-header">
    <div class="header-container">
        <a href="index.html" class="header-logo">
            <img src="images/BVA-logo-blauw-web.png" alt="Boeren van Amstel">
        </a>
        
        <nav class="header-nav">
            <a href="#" class="nav-link">Ontdek Amstelgebied op de kaart</a>
            <a href="#" class="nav-link">Onze resultaten</a>
            <a href="#" class="nav-link btn-cta">Doe mee!</a>
        </nav>
    </div>
</header>
   <main class="main-content-flow">
       <h1 class="flow-title">Doneer en draag bij aan natuurherstel als particulier</h1>


       <div class="promo-header-zone">
           <img src="images/pakmelk.png" alt="Pak melk" class="promo-milk-pic">
           <p class="promo-text-bubble">Ontvang een pak melk bij een donatie vanaf 20 euro!</p>
       </div>


       <div class="base-flow-card">
           <!-- Hier is de action aangepast naar het feedbackscherm -->
           <form action="feedbackscherm.html" method="POST">
              
               <div class="flow-row">
                   <label class="flow-label">Doneer als</label>
                   <div class="toggle-switch-container">
                       <button type="button" class="btn-toggle active" onclick="location.href='particulierdoneren.html'">Particulier</button>
                       <button type="button" class="btn-toggle" onclick="location.href='bedrijfdoneren.html'">Bedrijf</button>
                   </div>
               </div>


               <div class="time-frequency-bar">
                   <button type="button" class="btn-time active">Eenmalig</button>
                   <button type="button" class="btn-time">Maandelijks</button>
                   <button type="button" class="btn-time">Jaarlijks</button>
               </div>


               <div class="form-grid-split">
                   <div>
                       <label class="flow-label">Kies je bedrag</label>
                       <div class="leaf-buttons-group">
                           <button type="button" class="btn-leaf">€3</button>
                           <button type="button" class="btn-leaf">€5</button>
                           <button type="button" class="btn-leaf">€10</button>
                           <button type="button" class="btn-leaf active">€20</button>
                       </div>
                   </div>
                   <div>
                       <label class="flow-label">Vul zelf een bedrag in</label>
                       <div class="currency-input-wrapper">
                           <span class="currency-sign">€</span>
                           <input type="number" class="flow-field-input" placeholder="0,00">
                       </div>
                   </div>
               </div>


               <div class="form-grid-split input-fields-margin">
                   <div class="input-element-cell">
                       <label>Voornaam</label>
                       <input type="text" class="flow-field-input" >
                   </div>
                   <div class="input-element-cell">
                       <label>Achternaam</label>
                       <input type="text" class="flow-field-input" >
                   </div>
                   <div class="input-element-cell">
                       <label>E-mailadres</label>
                       <input type="email" class="flow-field-input" >
                   </div>
                   <div class="input-element-cell">
                       <label>Bank</label>
                       <select class="flow-field-input" >
                           <option value="">Kies uw bank</option>
                           <option value="ideal">iDEAL / Rabobank</option>
                           <option value="ing">iDEAL / ING</option>
                           <option value="abn">iDEAL / ABN AMRO</option>
                       </select>
                   </div>
               </div>


               <div class="action-footer-right">
                   <button type="submit" class="btn-submit-flow">Doneer</button>
               </div>
           </form>
       </div>


       <div class="navigation-back-zone">
           <a href="doneerpagina-1.html" class="btn-back-flow">Terug</a>
       </div>
   </main>


</body>
</html>
