<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weidevogelgebied-grutto-1</title>
    <link rel="stylesheet" href="style-yunus.css">
</head>

<body>
    <img src="images/kaartGruttoPers.png" class="map-bg" alt="Kaart Achtergrond">

    <nav class="side-navbar">
        <div class="nav-top"><img src="images/hamburgermenu.png" class="menu-icon" alt="Menu"></div>
        <div class="nav-bottom">
            <img src="images/gruttoPersOptie.svg" class="nav-btn" alt="Bird">
            <img src="images/settings.png" class="nav-btn" alt="Settings">
            <img src="images/info.png" class="nav-btn" alt="Info">
        </div>
    </nav>

    <img src="images/wolkAchterLogo.png" class="wolkAchterLogo">
    <img src="images/bva-logo-blauw.png" class="logoKaart">

    <section class="content-overlay">
        <div class="dome-container">
            <img src="images/groteWolkTextbox.png" class="dome-bg" alt="Achtergrond">
            <img src="images/sluitButton.png" class="close-png" alt="Sluiten"
                onclick="window.location.href='kaart-grutto.html'">
            <div class="title-wrapper">
                <h2 class="title-blue">Wat maakt deze plek veilig voor mij?</h2>
            </div>

            <div class="boer-step" style="display: flex;">
                <div class="video-container">
                    <video class="video-player" controls poster="images/tumpnail.png" autoplay loop playsinline>
                        <source src="videos/boer1.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="button-row" style="justify-content: center;">
                    <button class="btn-action" onclick="window.location.href='weidevogelsgebied2.html'">
                        Ontdek hoe Boeren van Amstel<br>bijdraagt aan natuurherstel
                    </button>
                </div>
            </div>

            <img src="images/gruttoIcoontje.svg " class="bottom-avatar" alt="Grutto">
        </div>
    </section>
</body>

</html>
