<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weidevogelgebied-grutto-1</title>
    <link rel="stylesheet" href="/weidevogelgebied1.css">
</head>
<body>
    <img src="/images/gruttokaart 2.png" class="map-bg" alt="Kaart Achtergrond">

    <nav class="side-navbar">
        <div class="nav-top">
            <img src="/images/hamburgermenu.png" class="menu-icon" alt="Menu">
        </div>
        <div class="nav-bottom">
            <img src="/images/gruttoPersOptie.png" class="nav-btn" alt="Bird">
            <img src="/images/settings.png" class="nav-btn" alt="Settings">
            <img src="/images/settings.png" class="nav-btn" alt="Info">
        </div>
    </nav>

    <img src="/images/wolkAchterLogo.png" class="wolkAchterLogo">
    <img src="images/bva-logo-blauw.png" class="logoKaart">

    <section class="content-overlay">
        
        <div class="dome-container">
            <div class="video-container">
                <video class="video-player" controls poster="/images/tumpnail.png">
                    <source src="/Video/Wat maakt deze plek veilig voor mij.mp4" type="video/mp4">
                    Je browser ondersteunt deze video niet.
                </video>
            </div>
        
            <!-- CTA BUTTON -->
            <button class="cta-button">
                Ontdek hoe Boeren van Amstel<br>
                bijdraagt aan natuurherstel
            </button>
        
            <!-- GRUTTO -->
            <img src="/images/weidevogelicoon.svg" class="grutto" alt="Grutto">
            
            <img src="/images/groteWolkTextbox.png" class="dome-bg" alt="Achtergrond">
            
            <img src="images/sluitButton.png" class="close-png" alt="Sluiten">

            <div class="title-wrapper">
                <h2 class="title-blue">Wat maakt deze plek veilig voor mij?</h2>
            </div>

        </div>
    </section>
</body>
</html>
