<!DOCTYPE html>

    <title>Weidevogelgebied-grutto-1</title>
    <link rel="stylesheet" href="/wiedvog2.css">

<body>
    <img src="/Afbeeldingen/gruttokaart 2.png" class="map-bg" alt="Kaart Achtergrond">

        <div class="nav-bottom">
            <img src="/Afbeeldingen/gruttoPersOptie.png" class="nav-btn" alt="Bird">
            <img src="/Afbeeldingen/settings.png" class="nav-btn" alt="Settings">

    <section class="content-overlay">

            <img src="/Afbeeldingen/groteWolkTextbox.png" class="dome-bg" alt="Achtergrond">

                <h2 class="title-blue">Hoe dragen Boeren van Amstel bij aan natuurherstel?</h2>
